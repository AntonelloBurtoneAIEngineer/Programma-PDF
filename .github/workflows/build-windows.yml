name: Compila Lyonel Burton per Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Usa il numero di versione del tag (es. v1.2.0 -> 1.2.0)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Compila l'installer (.exe)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Carica gli .exe come artefatti
        uses: actions/upload-artifact@v4
        with:
          name: Lyonel-Burton-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Pubblica una Release (solo se il commit ha un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lyonel Burton ${{ github.ref_name }}
          files: dist/*.exe
          body: |
            Scarica **Lyonel-Burton-Setup** per installare il programma, oppure **Lyonel-Burton-Portable** per usarlo senza installazione.
            Al primo avvio Windows può mostrare «Windows ha protetto il PC»: premi «Ulteriori informazioni» e poi «Esegui comunque».
