name: Compila Lettore PDF per Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Compila l'installer (.exe)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Carica gli .exe come artefatti
        uses: actions/upload-artifact@v4
        with:
          name: Lettore-PDF-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Pubblica una Release (solo se il commit ha un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
